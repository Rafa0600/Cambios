        const k = claveStock();
        const r = await fetchT(url, { ...opts, headers: { ...(opts.headers || {}), 'X-Clave': k } }, 30000);
        if (r.status !== 401) return r;
        guardarClaveStock('');                           // la rechazó: no se mandó nada → pedirla de nuevo
        if (!(await pedirClaveStock(true))) throw new Error('Sin clave: no se mandó nada');
    }
    throw new Error('Clave incorrecta: no se mandó nada');
}
async function mandarMensajeML(cuenta, venta, texto, buyerId) {
    const r = await fetchConClave(`${ECOMM_PROXY}/ml-mensaje`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cuenta: String(cuenta || '').toLowerCase(), venta, texto, buyer_id: buyerId || '' }) });
    let d = null; try { d = await r.json(); } catch (e) {}
    if (!r.ok || !d || !d.ok) throw new Error((d && d.error) || ('respondió ' + r.status));
    return d;
}

async function mlPost(cta, path, body) {
    for (let i = 0; i < 2; i++) {
        const { access_token } = await getToken(cta);
        const r = await fetchT(`${cta.proxy}${path}`, { method: 'POST', cache: 'no-store',
            headers: { Authorization: `Bearer ${access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, 20000);
        if (r.status === 401 && i === 0) { tokens.del(cta.proxy); continue; }
        let d = null; try { d = await r.json(); } catch (e) {}
        if (!r.ok) throw new Error((d && (d.message || d.error)) || ('ML respondió ' + r.status));
        return d;
    }
}
let _contando = false;
async function cargarConteos(forzar) {          // de a 3; si cambió algún número, repinta
    if (_contando) return;
    const lista = (TAB === 'hechos' ? HECHOS : PEND).filter(c => c.venta && c.cuenta && (forzar || !MSG_N.has(claveMsg(c))));
    if (!lista.length) return;
    _contando = true;
    let cambio = false, sig = 0;
    await Promise.all(Array.from({ length: Math.min(3, lista.length) }, async () => {
        while (sig < lista.length) {
            const c = lista[sig++], k = claveMsg(c);
            try {
                const actAntes = MSG_ACT.get(k), n = await contarMensajes(c.cuenta, c.venta);
                if (MSG_N.get(k) !== n || MSG_ACT.get(k) !== actAntes) { MSG_N.set(k, n); cambio = true; }
            }
            catch (e) { if (!MSG_N.has(k)) MSG_N.set(k, 0); }      // sin internet: no reintentar en cada repintada
        }
    }));
    _contando = false;
    if (cambio) pintar();
}

async function mensajesDe(cuenta, venta) {
    const cta = CUENTAS.find(x => x.nombre === cuenta);
    if (!cta) throw new Error('no sé de qué cuenta es esta venta');
    const { user_id } = await getToken(cta);
    const msgs = []; let estado = null, maxLargo = 0;
    for (let off = 0; off < 300; off += 50) {
        const d = await mlGet(cta, `/api/messages/packs/${encodeURIComponent(venta)}/sellers/${user_id}?tag=post_sale&mark_as_read=false&limit=50&offset=${off}`);
        if (!d) break;
        estado = d.conversation_status || estado;
        maxLargo = d.seller_max_message_length || maxLargo;
        msgs.push(...(d.messages || []));
        if ((d.messages || []).length < 50) break;
    }
    const cuando = m => (m.message_date && (m.message_date.created || m.message_date.received)) || m.date_created || '';
    msgs.sort((a, b) => String(cuando(a)).localeCompare(String(cuando(b))));        // del más viejo al más nuevo
    return { cta, uid: String(user_id), msgs, estado, cuando, maxLargo: maxLargo || 350 };
}
const fechaMsg = iso => {
    const d = new Date(iso); if (isNaN(d)) return '';
    const dia = d.toLocaleDateString('sv-SE', { timeZone: TZ });
    const hora = d.toLocaleTimeString('es-AR', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: false });
    return `${relDia(dia) || `${DIAS[diaSem(dia)].slice(0, 3)} ${ddmm(dia)}`} ${hora}`;
};
async function abrirMensajes(c) {
    const hd = `<div class="sub-hd"><b>💬 ${esc(c.nick || c.comprador || '')}</b><button class="hdr-btn" data-cerrar>✕</button></div>` +
        `<div class="ayuda" style="margin:-4px 0 10px">${esc(c.cuenta || '')} · venta #${esc(c.venta)} · no se marcan como leídos</div>`;
    $('subIn').innerHTML = hd + '<div class="cargando">Cargando mensajes…</div>';
    $('sub').classList.add('open');
    let r;
    try { r = await mensajesDe(c.cuenta, c.venta); }
    catch (e) { $('subIn').innerHTML = hd + `<div class="error">😕 No pude traer los mensajes: ${esc(e.message || e)}</div>`; return; }
    const { cta, uid, msgs, estado, cuando, maxLargo } = r;
    MSG_N.set(claveMsg(c), msgs.length);
    const activa = !!(estado && estado.status === 'active');
    MSG_ACT.set(claveMsg(c), activa);
    // El comprador: el que está guardado en el cambio, o el "otro" de la conversación
    const otro = msgs.map(m => String((m.from || {}).user_id) === uid ? (m.to || {}).user_id : (m.from || {}).user_id).find(Boolean);
    const buyerId = String(c.buyer_id || otro || '');
    const burbuja = m => {
        const yo = String((m.from || {}).user_id) === uid;
        const md = m.message_date || {};
        const adj = (m.message_attachments || []).map(a =>
            `<button class="adj" data-adj="${esc(a.filename)}" data-tipo="${esc(a.type || '')}">📎 ${esc(a.original_filename || 'Adjunto')} · ver</button>`).join('');
        const mod = m.message_moderation && m.message_moderation.status && !['clean', 'non_moderated'].includes(m.message_moderation.status)
            ? ' · ⚠️ moderado por ML' : '';
        const visto = yo ? (md.read ? ' · ✓✓ lo leyó' : ' · enviado') : '';
        return `<div class="msg ${yo ? 'yo' : 'el'}">${m.text ? `<div class="burb">${esc(m.text)}</div>` : ''}${adj}` +
            `<div class="mt">${yo ? 'Nosotros' : 'Comprador'} · ${esc(fechaMsg(cuando(m)))}${visto}${mod}</div></div>`;
    };
    // Escribir: solo si ML deja (conversación activa). Si está bloqueada, se explica por qué.
    const escribir = activa
        ? `<div class="redactar"><textarea id="msgTxt" maxlength="${maxLargo}" placeholder="Escribile a ${esc(c.nick || 'el comprador')}…"></textarea>` +
          `<div class="redactar-pie"><span id="msgCont">0/${maxLargo}</span><button class="btn2 amarillo" id="msgEnviar">Enviar</button></div>` +
          `<div class="ayuda" style="margin-top:4px">Lo lee el comprador en Mercado Libre. Sin teléfonos, mails ni links (ML los bloquea).</div></div>`
        : `<div class="chat-aviso">🔒 ${estado && estado.substatus && /initiated_by_seller/.test(estado.substatus)
            ? 'Mercado Libre no deja escribirle hasta que el comprador mande un mensaje.'
            : 'Mercado Libre no deja mandar mensajes en esta venta.'}</div>`;
    $('subIn').innerHTML = hd + (msgs.length ? `<div class="chat" id="chat">${msgs.map(burbuja).join('')}</div>`
        : `<div class="vacio" style="padding:22px 10px"><big>💬</big>No hay mensajes en esta venta.</div>`) + escribir;
    const ch = $('chat'); if (ch) ch.scrollTop = ch.scrollHeight;          // abre en el último
    const txt = $('msgTxt');
    if (txt) txt.oninput = () => { $('msgCont').textContent = `${txt.value.length}/${maxLargo}`; };
    $('subIn').onclick = async e => {
        if (e.target.closest('#msgEnviar')) {                                 // mandar el mensaje
            const t = (txt.value || '').trim();
            if (!t) return toast('Escribí el mensaje');
            if (!confirm(`¿Mandarle este mensaje a ${c.nick || 'el comprador'}?\n\n${t}`)) return;
            const b = $('msgEnviar'); b.disabled = true; b.textContent = 'Enviando…';
            try {
                await mandarMensajeML(c.cuenta, c.venta, t, buyerId);                  // por Ecomm, con la clave del stock
                toast('✓ Mensaje enviado');
                MSG_N.set(claveMsg(c), (MSG_N.get(claveMsg(c)) || 0) + 1);
                await sleep(1500);                                            // que ML lo registre antes de recargar
                abrirMensajes(c);
                pintar();
            } catch (err) {
                b.disabled = false; b.textContent = 'Enviar';
                toast('No se pudo mandar: ' + (err.message || err), null, null, 6000);
            }
            return;
        }
        // Adjuntos (fotos que manda el comprador): se bajan con el permiso de la cuenta
        const b = e.target.closest('[data-adj]'); if (!b) return;
        b.disabled = true; b.textContent = '📎 Bajando…';
        try {
            const { access_token } = await getToken(cta);      // por la nube: el proxy rompe las fotos
            const resp = await fetchT(`${HIST_URL}/api/adjunto?f=${encodeURIComponent(b.dataset.adj)}`,
                { headers: { 'X-Clave': clave(), 'X-ML-Token': access_token } }, 30000);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const blob = await resp.blob(), url = URL.createObjectURL(blob);
            if (/^image\//.test(blob.type)) { const img = document.createElement('img'); img.src = url; img.className = 'adj-img'; b.replaceWith(img); }
            else { window.open(url, '_blank'); b.textContent = '📎 Abierto'; }
        } catch (err) { b.textContent = '📎 No se pudo bajar (miralo en ML)'; }
    };
}

// ══════════════════════════════════════════════════════════════════════════
//  AVISOS AL CELULAR (lun–vie 10:00 los de hoy · 13:00 los que quedan)
//  El celu se anota en la nube (push_subs) y el Worker manda el aviso a esa hora.
// ══════════════════════════════════════════════════════════════════════════
const VAPID_PUBLIC = 'BOF91aLGKbOwpVo91aDXqSfIMzJxtN7TEbmcemnFH0ToJJDqPs77h5xXg9WGXfJptacsiFL7XNT6egE1avkXeEw';
const PUSH_OCULTO = 'cambios_aviso_banner_oculto';
const pushSoportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && window.isSecureContext;
const b64uDec = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
async function suscripcion() {
    if (!pushSoportado() || Notification.permission !== 'granted') return null;
    try {
        const reg = await Promise.race([navigator.serviceWorker.ready, sleep(4000).then(() => null)]);
        return reg ? await reg.pushManager.getSubscription() : null;
    } catch (e) { return null; }
}
let AVISOS_ON = false;
async function pintarCampana() {
    AVISOS_ON = !!(await suscripcion());
    const b = $('btnAvisos');
    b.textContent = AVISOS_ON ? '🔔' : '🔕';
    b.classList.toggle('on', AVISOS_ON);
    if (clave()) pintar();
}
function bannerAvisos() {
    let oculto = false; try { oculto = !!localStorage.getItem(PUSH_OCULTO); } catch (e) {}
    if (AVISOS_ON || oculto || !pushSoportado() || Notification.permission === 'denied' || !clave()) return '';
    return `<div class="banner"><span>🔔 ¿Te aviso los cambios a las <b>10</b> y a las <b>13</b>?</span>` +
        `<button data-avisos="1">Activar</button><button class="x" data-avisos-x="1" title="No mostrar más">✕</button></div>`;
}
const nombreEquipo = () => { const u = navigator.userAgent; return `${/Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iPhone' : 'PC'} · ${hoyAR()}`; };

async function abrirAvisos() {
    const s = await suscripcion();
    let h = `<div class="sub-hd"><b>🔔 Avisos al celular</b><button class="hdr-btn" data-cerrar>✕</button></div>` +
        `<div class="aviso-hor"><div><b>10:00</b><span>Los cambios de hoy</span></div><div><b>13:00</b><span>Los que quedan sin hacer</span></div></div>` +
        `<div class="ayuda" style="margin:0">De lunes a viernes y solo si hay cambios. Llega aunque la app esté cerrada; tocás el aviso y se abre la lista.</div>`;
    if (!pushSoportado()) h += `<div class="error">Acá no se pueden recibir avisos. Abrila desde la app instalada en el celu (Chrome).</div>`;
    else if (Notification.permission === 'denied') h += `<div class="error">Los avisos están bloqueados para esta app.</div><div class="ayuda">Activalos en Ajustes del celu → Apps → Cambios (o Chrome) → Notificaciones, y volvé a tocar 🔕.</div>`;
    else if (s) h += `<div class="ok-txt">✓ Activados en este celu</div><div class="aviso-btns">` +
        `<button class="btn2 amarillo" id="avProbar">Mandarme un aviso de prueba</button><button class="btn2" id="avDesactivar">Desactivar en este celu</button></div>`;
    else h += `<div class="aviso-btns"><button class="guardar" id="avActivar">🔔 Activar avisos en este celu</button></div>`;
    h += `<div class="ayuda" id="avMsg" style="margin-top:10px"></div>`;
    $('subIn').innerHTML = h;
    $('sub').classList.add('open');
    $('subIn').onclick = async e => {
        const msg = (t, err) => { const m = $('avMsg'); if (m) { m.textContent = t; m.className = err ? 'error' : 'ayuda'; } };
        if (e.target.closest('#avActivar')) {
            try {
                msg('Pidiendo permiso al celu…');
                if (await Notification.requestPermission() !== 'granted') return msg('No se dio el permiso de avisos.', true);
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (sub && sub.options && sub.options.applicationServerKey) {     // anotado con otra clave → rehacer
                    const k = new Uint8Array(sub.options.applicationServerKey);
                    if (k.join() !== b64uDec(VAPID_PUBLIC).join()) { await sub.unsubscribe(); sub = null; }
                }
                if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uDec(VAPID_PUBLIC) });
                const j = sub.toJSON();
                msg('Anotando este celu en la nube…');
                await api('/api/push/suscribir', { endpoint: j.endpoint, keys: j.keys, nombre: nombreEquipo() });
                const r = await api('/api/push/probar', { endpoint: j.endpoint });
                await pintarCampana();
                abrirAvisos();
                toast(r.ok ? '🔔 Listo: te mandé un aviso de prueba' : 'Quedó anotado, pero el aviso de prueba no salió', null, null, 5000);
            } catch (err) { msg('No se pudo activar: ' + (err.clave ? 'falta la clave' : (err.message || err)), true); }
            return;
        }
        if (e.target.closest('#avProbar')) {
            try {
                msg('Mandando…');
                const sub = await suscripcion();
                const r = await api('/api/push/probar', { endpoint: sub.endpoint });
                msg(r.ok ? '✓ Enviado: en unos segundos te llega el aviso.' : 'No salió el aviso. Probá desactivar y activar de nuevo.', !r.ok);
            } catch (err) { msg('No se pudo: ' + (err.message || err), true); }
            return;
        }
        if (e.target.closest('#avDesactivar')) {
            try {
                const sub = await suscripcion();
                if (sub) { await api('/api/push/borrar', { endpoint: sub.endpoint }).catch(() => {}); await sub.unsubscribe(); }
                await pintarCampana(); abrirAvisos(); toast('🔕 Avisos desactivados en este celu');
            } catch (err) { msg('No se pudo: ' + (err.message || err), true); }
        }
    };
}
$('btnAvisos').onclick = () => { if (!clave()) return pintarClave(); abrirAvisos(); };

leerCache();

if ('serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('./sw.js').then(r => { try { r.update(); } catch (e) {} }).catch(() => {});
}
pintarCampana();

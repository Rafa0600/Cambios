<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Cambios · Mikra</title>
    <meta name="theme-color" content="#080810">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cambios">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080810; --surface: #0f0f1a; --surface-2: #16162a; --surface-3: #1d1d36;
            --border: #1c1c2e; --border-bright: #2a2a40;
            --text: #e0e0f0; --muted: #6a6a85; --muted-2: #8a8aa5;
            --yellow: #FFE600; --green: #00e676; --blue: #40c4ff; --red: #ff4d5e;
            --purple: #c58bff; --orange: #ffaa44; --pink: #ff6fb5;
            --mikra: #2f7bff; --chaya: #e0408a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { overflow-x: hidden; }
        body { font-family: 'Space Grotesk', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; padding-bottom: calc(110px + env(safe-area-inset-bottom)); }
        button { font-family: inherit; cursor: pointer; }
        input, textarea { font-family: inherit; }
        .mono { font-family: 'Space Mono', monospace; }

        /* ── Header ── */
        .hdr { position: sticky; top: 0; z-index: 50; background: rgba(8,8,16,.94);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); padding: calc(12px + env(safe-area-inset-top)) 16px 0; }
        .hdr-top { display: flex; align-items: center; gap: 10px; }
        .hdr h1 { font-size: 19px; font-weight: 700; letter-spacing: -.4px; flex: 1; }
        .hdr h1 span { color: var(--yellow); }
        .hdr-btn { width: 38px; height: 38px; border-radius: 11px; border: 1px solid var(--border-bright);
            background: var(--surface-2); color: var(--text); font-size: 17px; display: grid; place-items: center; }
        .hdr-btn.girando { animation: gira .8s linear infinite; }
        @keyframes gira { to { transform: rotate(360deg); } }
        .resumen { display: flex; gap: 8px; margin: 12px auto 10px; }
        .hdr-top, .resumen, .tabs { max-width: 680px; margin-left: auto; margin-right: auto; }
        .res-box { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 8px 10px; }
        .res-box b { display: block; font-family: 'Space Mono', monospace; font-size: 22px; line-height: 1.1; }
        .res-box span { font-size: 10.5px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .4px; }
        .res-box.atr b { color: var(--red); } .res-box.hoy b { color: var(--yellow); } .res-box.prox b { color: var(--blue); }
        .tabs { display: flex; gap: 4px; }
        .tab { flex: 1; padding: 10px 0 11px; border: none; background: none; color: var(--muted-2);
            font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; }
        .tab.on { color: var(--text); border-bottom-color: var(--yellow); }

        /* ── Lista ── */
        main { padding: 6px 14px 0; max-width: 680px; margin: 0 auto; }
        .grupo-t { display: flex; align-items: baseline; gap: 8px; margin: 18px 2px 8px; }
        .grupo-t b { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; }
        .grupo-t span { font-size: 12px; color: var(--muted-2); }
        .grupo-t i { margin-left: auto; font-style: normal; font-family: 'Space Mono', monospace; font-size: 12px;
            color: var(--muted-2); background: var(--surface-2); border-radius: 20px; padding: 2px 9px; }
        .grupo-t.atr b { color: var(--red); } .grupo-t.hoy b { color: var(--yellow); }
        .vacio { text-align: center; color: var(--muted-2); padding: 48px 20px; font-size: 14px; line-height: 1.6; }
        .vacio big { display: block; font-size: 40px; margin-bottom: 8px; }

        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 12px 12px 10px;
            margin-bottom: 10px; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--blue); }
        .card.m-confusion::before { background: var(--orange); }
        .card.m-otro::before { background: var(--purple); }
        .card.hecho { opacity: .78; }
        .c-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; cursor: pointer; }
        .chev { color: var(--muted-2); font-size: 16px; line-height: 1; transition: transform .2s; padding: 0 2px 4px; }
        .card.abierta .chev { transform: rotate(180deg); padding: 4px 2px 0; }
        .c-res { display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer; }
        .c-res .th { display: flex; gap: 3px; flex: none; }
        .c-res img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; background: #fff; }
        .c-res .tx { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.35; color: var(--muted-2); overflow: hidden;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .card.abierta .c-res { display: none; }
        .card:not(.abierta) .c-det { display: none; }
        .card:not(.abierta) { padding-bottom: 12px; }
        .cta { font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 3px 7px; border-radius: 6px; color: #fff; }
        .cta.Mikra { background: var(--mikra); } .cta.Chaya { background: var(--chaya); }
        .nick { font-size: 15px; font-weight: 700; background: none; border: none; color: var(--text); padding: 2px 0;
            text-align: left; overflow-wrap: anywhere; }
        .motivo { margin-left: auto; font-size: 11.5px; font-weight: 600; padding: 4px 9px; border-radius: 20px;
            background: rgba(64,196,255,.12); color: var(--blue); white-space: nowrap; }
        .m-confusion .motivo { background: rgba(255,170,68,.13); color: var(--orange); }
        .m-otro .motivo { background: rgba(197,139,255,.13); color: var(--purple); }
        .c-sub { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; font-size: 12.5px; color: var(--muted-2); }
        .chip-cp[data-venta] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
        .chip-cp { font-family: 'Space Mono', monospace; font-size: 11.5px; font-weight: 700; color: var(--text);
            background: var(--surface-2); border: 1px solid var(--border-bright); border-radius: 8px; padding: 5px 8px; }
        .chip-cp i { font-style: normal; color: var(--yellow); margin-left: 4px; font-size: 10.5px; }
        .chip-cp.ok { border-color: var(--green); } .chip-cp.ok i { color: var(--green); }
        .c-sec { margin-top: 10px; }
        .c-sec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted-2); margin-bottom: 5px; font-weight: 600; }
        .c-sec.lleva h4 { color: var(--green); } .c-sec.retira h4 { color: var(--orange); }
        .it { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 10px; background: var(--surface-2); margin-bottom: 5px; }
        .it img, .it .sinf { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; background: #fff; flex: none; }
        .it .sinf { background: var(--surface-3); display: grid; place-items: center; font-size: 18px; }
        .it-tx { flex: 1; min-width: 0; }
        .it-tx b { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .it-tx span { font-size: 12.5px; color: var(--muted-2); }
        .it-tx span em { font-style: normal; color: var(--text); font-weight: 600; }
        .it-tx .tl { color: var(--yellow); font-weight: 700; }
        .it-tx .antes-tx { font-size: 11.5px; color: var(--muted); }
        .desc-ok { display: inline-block; margin-top: 4px; font-size: 11.5px; font-weight: 700; color: var(--green); background: rgba(0,230,118,.08);
            border: 1px solid rgba(0,230,118,.3); border-radius: 7px; padding: 2px 7px; line-height: 1.35; }
        .desc-ok strong { font-family: 'Space Mono', monospace; font-size: 12.5px; }
        .desc-ok i { font-style: normal; font-weight: 500; color: var(--muted); font-size: 10.5px; margin-left: 3px; }
        .desc-ok.mal { color: var(--orange); background: rgba(255,170,68,.08); border-color: rgba(255,170,68,.4); }
        .it:has(.desc-ok:not(.mal)) { background: rgba(0,230,118,.07); box-shadow: 0 0 0 1px rgba(0,230,118,.28) inset; }
        .ecom-chk { width: 28px; height: 28px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none;
            font-size: 17px; font-weight: 900; line-height: 1; background: var(--green); color: #04120a; box-shadow: 0 0 0 3px rgba(0,230,118,.18); }
        .ecom-chk.falta { background: rgba(255,170,68,.14); color: var(--orange); box-shadow: 0 0 0 1px rgba(255,170,68,.5) inset; font-size: 14px; }
        .ecom-chk.corre { background: rgba(64,196,255,.14); color: var(--blue); box-shadow: 0 0 0 1px rgba(64,196,255,.5) inset; font-size: 13px; }
        .ok-chip.corre { color: var(--blue); background: rgba(64,196,255,.08); border-color: rgba(64,196,255,.35); }
        .it .q { font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px; color: var(--muted-2); padding-right: 4px; }
        .c-nota { margin-top: 8px; font-size: 13px; background: rgba(255,230,0,.06); border: 1px dashed rgba(255,230,0,.25);
            border-radius: 10px; padding: 7px 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
        .c-acc { display: flex; gap: 6px; margin-top: 10px; }
        .c-acc button { height: 40px; border-radius: 11px; border: 1px solid var(--border-bright); background: var(--surface-2);
            color: var(--text); font-size: 15px; padding: 0 12px; }
        .c-acc .hecho-btn { flex: 1; background: rgba(0,230,118,.12); border-color: rgba(0,230,118,.35); color: var(--green);
            font-weight: 700; font-size: 14px; }
        .c-acc .volver-btn { flex: 1; font-size: 13.5px; font-weight: 600; }
        .c-meta { font-size: 11px; color: var(--muted); margin-top: 7px; }
        .mover { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

        /* ── Botón flotante ── */
        .fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom));
            z-index: 60; height: 56px; padding: 0 26px; border-radius: 28px; border: none; background: var(--yellow); color: #000;
            font-size: 16px; font-weight: 700; box-shadow: 0 8px 30px rgba(255,230,0,.25), 0 4px 14px rgba(0,0,0,.6); white-space: nowrap; }

        /* ── Hoja (formulario) ── */
        .hoja { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: none; flex-direction: column; }
        .hoja.open { display: flex; animation: sube .22s ease-out; }
        @keyframes sube { from { transform: translateY(30px); opacity: 0; } }
        .hoja-hd { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
            border-bottom: 1px solid var(--border); background: var(--surface); }
        .hoja-hd b { flex: 1; font-size: 17px; }
        .hoja-bd { flex: 1; overflow-y: auto; padding: 4px 14px 120px; -webkit-overflow-scrolling: touch; }
        .hoja-bd > div { max-width: 680px; margin: 0 auto; }
        .hoja-ft { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            background: linear-gradient(transparent, var(--bg) 30%); }
        .guardar { width: 100%; max-width: 680px; margin: 0 auto; display: block; height: 56px; border-radius: 16px; border: none;
            background: var(--yellow); color: #000; font-size: 16px; font-weight: 700; }
        .guardar:disabled { background: var(--surface-3); color: var(--muted); }
        .paso { margin-top: 18px; }
        .paso-t { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; text-transform: uppercase;
            letter-spacing: .6px; color: var(--muted-2); margin-bottom: 9px; }
        .paso-t .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3);
            color: var(--text); font-family: 'Space Mono', monospace; font-size: 12px; }
        .paso.listo .paso-t .n { background: var(--green); color: #000; }
        .busq { display: flex; gap: 6px; }
        .busq input { flex: 1; min-width: 0; height: 48px; border-radius: 12px; border: 1px solid var(--border-bright);
            background: var(--surface-2); color: var(--text); padding: 0 13px; font-size: 16px; outline: none; }
        .busq input:focus { border-color: var(--yellow); }
        .busq button { height: 48px; border-radius: 12px; border: 1px solid var(--border-bright); background: var(--surface-2);
            color: var(--text); font-weight: 700; padding: 0 12px; font-size: 14px; white-space: nowrap; }
        .busq button.ir { background: var(--yellow); color: #000; border: none; }
        .ayuda { font-size: 11.5px; color: var(--muted); margin: 6px 2px 0; }
        .ayuda.aviso { color: var(--yellow); }
        .cargando { color: var(--muted-2); font-size: 13.5px; padding: 16px 4px; text-align: center; }
        .error { color: var(--red); font-size: 13.5px; padding: 12px 4px; }
        .sug { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .sug button { text-align: left; background: var(--surface); border: 1px solid var(--border-bright); border-radius: 12px;
            padding: 10px 12px; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .sug button b { font-size: 14.5px; flex: 1; overflow-wrap: anywhere; }
        .sug button span { font-size: 11.5px; color: var(--muted-2); white-space: nowrap; }
        .sug-t { font-size: 12px; color: var(--muted-2); margin-top: 10px; }
        .compra { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
            padding: 10px; color: var(--text); margin-top: 8px; display: block; }
        .compra.sel { border-color: var(--yellow); box-shadow: 0 0 0 1px var(--yellow) inset; }
        .compra-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted-2); }
        .compra-top .est { margin-left: auto; font-weight: 600; }
        .est.ok { color: var(--green); } .est.warn { color: var(--orange); } .est.bad { color: var(--red); }
        .compra .its { margin-top: 7px; }
        .compra .it { background: var(--surface-2); }
        .sel-resumen { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border-bright);
            border-radius: 14px; padding: 10px 12px; }
        .sel-resumen div { flex: 1; min-width: 0; }
        .sel-resumen b { display: block; font-size: 15px; overflow-wrap: anywhere; }
        .sel-resumen span { font-size: 12px; color: var(--muted-2); }
        .link-btn { background: none; border: none; color: var(--yellow); font-weight: 700; font-size: 13px; padding: 6px; }
        .opciones { display: grid; gap: 8px; }
        .opc { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--surface); border: 1px solid var(--border-bright);
            border-radius: 14px; padding: 13px 12px; color: var(--text); }
        .opc big { font-size: 24px; }
        .opc b { display: block; font-size: 15px; }
        .opc span { font-size: 12px; color: var(--muted-2); }
        .opc.on { border-color: var(--yellow); background: rgba(255,230,0,.07); }
        .art { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 8px; margin-bottom: 8px; }
        .art.on { border-color: rgba(0,230,118,.45); }
        .art .it { background: transparent; margin: 0; padding: 0; }
        .art-acc { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
        .btn2 { height: 38px; border-radius: 10px; border: 1px solid var(--border-bright); background: var(--surface-2);
            color: var(--text); font-weight: 600; font-size: 13.5px; padding: 0 12px; }
        .btn2.on { border-color: var(--green); color: var(--green); background: rgba(0,230,118,.08); }
        .btn2.amarillo { border-color: rgba(255,230,0,.5); color: var(--yellow); }
        .nuevo-tag { font-size: 13px; color: var(--green); font-weight: 700; }
        .cant { display: flex; width: 100%; align-items: center; gap: 8px; font-size: 13px; color: var(--muted-2); }
        .cant .btn2 { width: 38px; padding: 0; font-size: 18px; font-weight: 800; }
        .cant .btn2:disabled { opacity: .35; }
        .cant b { font-family: 'Space Mono', monospace; font-size: 15px; color: var(--yellow); }
        .toggle { display: flex; background: var(--surface-2); border: 1px solid var(--border-bright); border-radius: 12px; padding: 3px; }
        .toggle button { flex: 1; height: 42px; border: none; border-radius: 9px; background: none; color: var(--muted-2); font-weight: 700; font-size: 14px; }
        .toggle button.on { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset; }
        .toggle button.on.si { color: var(--orange); }
        .dias { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .dias::-webkit-scrollbar { display: none; }
        .dia { flex: none; min-width: 74px; border: 1px solid var(--border-bright); background: var(--surface); border-radius: 12px;
            padding: 8px 10px; color: var(--text); text-align: center; }
        .dia small { display: block; font-size: 10.5px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .4px; }
        .dia b { font-size: 15px; }
        .dia.on { border-color: var(--yellow); background: rgba(255,230,0,.08); }
        .dia.on small { color: var(--yellow); }
        .dia input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: none; }
        textarea.nota { width: 100%; min-height: 76px; border-radius: 12px; border: 1px solid var(--border-bright); background: var(--surface-2);
            color: var(--text); padding: 10px 12px; font-size: 15px; outline: none; resize: vertical; }
        textarea.nota:focus { border-color: var(--yellow); }

        /* ── Sub-hoja (elegir talle/color, con quién) ── */
        .sub { position: fixed; inset: 0; z-index: 150; background: rgba(0,0,0,.6); display: none; align-items: flex-end; justify-content: center; }
        .sub.open { display: flex; }
        .sub-in { width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0;
            border-top: 1px solid var(--border-bright); padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); animation: sube .2s ease-out; }
        .sub-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
        .sub-hd b { flex: 1; font-size: 16px; }
        .grilla-wrap { overflow-x: auto; margin: 0 -2px; }
        table.grilla { border-collapse: separate; border-spacing: 3px; min-width: 100%; }
        .grilla th { font-size: 11.5px; color: var(--muted-2); font-weight: 700; padding: 2px 2px; }
        .grilla th.yo { color: var(--yellow); }
        .grilla td.col { font-size: 12px; font-weight: 600; white-space: nowrap; padding-right: 4px; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
        .grilla tr.yo td.col { color: var(--yellow); }
        .cel { width: 100%; min-width: 34px; height: 40px; border-radius: 9px; border: 1px solid var(--border-bright); background: var(--surface-2);
            color: var(--text); font-family: 'Space Mono', monospace; font-weight: 700; font-size: 13px; padding: 0; }
        .cel.hay { background: rgba(0,230,118,.12); border-color: rgba(0,230,118,.35); color: var(--green); }
        .cel.pocos { background: rgba(255,170,68,.12); border-color: rgba(255,170,68,.4); color: var(--orange); }
        .cel.s0 { color: var(--muted); opacity: .7; }
        .cel.yo { outline: 2px dashed var(--yellow); outline-offset: 1px; }
        .cel.elegida { background: var(--yellow); color: #000; border-color: var(--yellow); }
        .cel.na { visibility: hidden; }
        .ley { font-size: 11.5px; color: var(--muted-2); margin-top: 8px; line-height: 1.5; }
        .manual { display: flex; gap: 6px; margin-top: 10px; }
        .manual input { flex: 1; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--border-bright); background: var(--surface-2);
            color: var(--text); padding: 0 10px; font-size: 15px; outline: none; }
        .vecinos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .vec { text-align: left; background: var(--surface-2); border: 1px solid var(--border-bright); border-radius: 12px; padding: 8px; color: var(--text); }
        .vec.yo { border-color: var(--yellow); opacity: .7; }
        .vec.on { border-color: var(--orange); box-shadow: 0 0 0 1px var(--orange) inset; }
        .vec-hd { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
        .vec-hd i { font-style: normal; color: var(--muted-2); font-family: 'Space Mono', monospace; }
        .vec-fotos { display: flex; gap: 3px; margin: 6px 0; height: 54px; }
        .vec-fotos img { height: 54px; width: 54px; border-radius: 6px; object-fit: cover; background: #fff; }
        .vec-who { font-size: 11.5px; color: var(--muted-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .cartel { border-radius: 18px; max-width: 420px; margin: 0 auto; border: 1px solid var(--border-bright); padding: 16px; }
        .cartel-tit { font-size: 17px; font-weight: 800; margin-bottom: 12px; }
        .cartel-fila { display: flex; gap: 10px; align-items: flex-start; padding: 10px 10px; border-radius: 12px; margin-bottom: 7px;

<script>
// ══════════════════════════════════════════════════════════════════════════
//  CAMBIOS — Mikra + Chaya
//  Se registra un cambio (buscar comprador → elegir la compra → qué pasó → qué
//  llevarle/retirarle → qué día hábil) y queda en la nube (Worker mikra-historial,
//  tabla "cambios", misma clave que el historial de preparación). La búsqueda en
//  ML, el catálogo (fotos, packs, stock por talle/color) y la clave son los MISMOS
//  del Resumen (mismo sitio rafa0600.github.io → comparten lo guardado en el celu).
// ══════════════════════════════════════════════════════════════════════════
const CUENTAS = [
    { nombre: 'Mikra', proxy: 'https://mikra-flex-proxy.rafaelassir.workers.dev' },
    { nombre: 'Chaya', proxy: 'https://chaya-flex-proxy.rafaelassir.workers.dev' },
];
const HIST_URL = 'https://mikra-historial.rafaelassir.workers.dev';
const CF_STOCK_URL = 'https://mikra-stock-cache.rafaelassir.workers.dev';
const TOKEN_LS_KEY = 'ml_token_cache_v1';          // el mismo del Resumen
const TOKEN_TTL_MS = 5.5 * 3600 * 1000;
const CAT_KEYS = { sku: 'resumen_sku_catalog_v2', packs: 'resumen_packmap_v1', img: 'resumen_imgmap_v1' };
const CAT_TTL = 12 * 3600 * 1000;
const CACHE_LS = 'cambios_cache_v1';
const TZ = 'America/Argentina/Buenos_Aires';
const DIAS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MOTIVOS = {
    cambio:    { ico: '🔁', txt: 'Otro talle o color', sub: 'Quiere cambiar por otro talle/color' },
    articulo:  { ico: '🔄', txt: 'Otro artículo', sub: 'Lo cambia por un artículo distinto (ej: biker sin bolsillo)' },
    otracosa:  { ico: '📦', txt: 'Le mandamos otra cosa', sub: 'Se le manda de nuevo lo que compró' },
    fallado:   { ico: '⚠️', txt: 'Fallado', sub: 'Se le manda uno nuevo y se retira el fallado' },
    confusion: { ico: '🔀', txt: 'Se confundió', sub: 'Le llegó el paquete de otro comprador' },
    otro:      { ico: '📝', txt: 'Otro', sub: 'Faltante u otra cosa (con nota)' },
};
const CON_NUEVO = new Set(['cambio', 'articulo']);              // se elige un artículo/variante NUEVO
const MANDAR_SUYO = new Set(['otracosa', 'fallado', 'confusion']); // se le manda de nuevo lo que compró

// ── Ayudas ────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function fetchT(url, opts = {}, ms = 15000) {
    const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms);
    try { return await fetch(url, { ...opts, signal: ctrl.signal }); } finally { clearTimeout(t); }
}
function toast(msg, accion, fn, ms = 4000) {
    document.querySelectorAll('.toast').forEach(t => t.remove());
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = `<span>${esc(msg)}</span>` + (accion ? `<button>${esc(accion)}</button>` : '');
    if (accion) t.querySelector('button').onclick = () => { t.remove(); fn && fn(); };
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms);
}
async function copiar(t) {
    try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
    try {
        const ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0;top:0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

// ── Fechas (hora Argentina) y días hábiles (lunes a viernes) ───────────────
const hoyAR = () => new Date().toLocaleDateString('sv-SE', { timeZone: TZ });
function sumarDias(iso, n) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
}
const diaSem = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };
const esHabil = iso => { const w = diaSem(iso); return w >= 1 && w <= 5; };
function proxHabil(iso) { let d = sumarDias(iso, 1); while (!esHabil(d)) d = sumarDias(d, 1); return d; }
function habiles(n) {          // hoy (si es hábil) + los próximos días hábiles
    const out = []; let d = hoyAR();
    if (!esHabil(d)) d = proxHabil(d);
    while (out.length < n) { out.push(d); d = proxHabil(d); }
    return out;
}
const ddmm = iso => { const [, m, d] = iso.split('-'); return `${+d}/${+m}`; };
function relDia(iso) {
    const h = hoyAR();
    if (iso === h) return 'hoy';
    if (iso === sumarDias(h, 1)) return 'mañana';
    if (iso === sumarDias(h, -1)) return 'ayer';
    return '';
}
const nombreDia = iso => `${DIAS[diaSem(iso)]} ${ddmm(iso)}`;
function cuandoTxt(isoDT) {        // "2026-11-15T10:30:00" (hora AR) → "hoy 10:30" / "13/11 18:02"
    const m = String(isoDT || '').match(/^(\d{4}-\d\d-\d\d)T(\d\d:\d\d)/);
    if (!m) return '';
    const r = relDia(m[1]);
    return `${r || ddmm(m[1])} ${m[2]}`;
}
function fechaML(iso) {             // fecha de ML (con zona) → "hace 3 días · 12/11"
    const d = new Date(iso); if (isNaN(d)) return '';
    const dia = d.toLocaleDateString('sv-SE', { timeZone: TZ });
    const r = relDia(dia);
    if (r) return r;
    const dif = Math.round((new Date(hoyAR()) - new Date(dia)) / 86400000);
    return dif > 1 ? `hace ${dif} días · ${ddmm(dia)}` : ddmm(dia);
}

// ── Clave de la nube (la misma del historial de preparación / Resumen) ──────
function clave() { try { return localStorage.getItem('clave_hist') || ''; } catch (e) { return ''; } }
async function api(path, body, hdrs) {
    const c = clave();
    if (!c) throw Object.assign(new Error('clave'), { clave: true });
    const r = await fetchT(HIST_URL + path, body === undefined ? { headers: { 'X-Clave': c } }
        : { method: 'POST', headers: { 'X-Clave': c, 'Content-Type': 'application/json', ...(hdrs || {}) }, body: JSON.stringify(body) });
    if (r.status === 401) { try { localStorage.removeItem('clave_hist'); } catch (e) {} throw Object.assign(new Error('clave'), { clave: true }); }
    if (r.status === 409) return r.json();
    if (!r.ok) throw new Error('La nube respondió ' + r.status);
    return r.json();
}

// ── Mercado Libre (por los proxies de cada cuenta, igual que la lupa del Resumen) ──
const tokens = {
    get(p) { try { const e = JSON.parse(localStorage.getItem(TOKEN_LS_KEY) || '{}')[p]; return e && Date.now() < e.expiresAt ? e : null; } catch (e) { return null; } },
    set(p, token, userId) { try { const a = JSON.parse(localStorage.getItem(TOKEN_LS_KEY) || '{}'); a[p] = { token, userId, expiresAt: Date.now() + TOKEN_TTL_MS }; localStorage.setItem(TOKEN_LS_KEY, JSON.stringify(a)); } catch (e) {} },
    del(p) { try { const a = JSON.parse(localStorage.getItem(TOKEN_LS_KEY) || '{}'); delete a[p]; localStorage.setItem(TOKEN_LS_KEY, JSON.stringify(a)); } catch (e) {} },
};
async function getToken(cta) {
    const c = tokens.get(cta.proxy);
    if (c) return { access_token: c.token, user_id: c.userId };
    const r = await fetchT(`${cta.proxy}/get-token`);
    const d = r.ok ? await r.json() : null;
    if (!d || !d.access_token) throw new Error('Sin permiso de ' + cta.nombre);
    tokens.set(cta.proxy, d.access_token, d.user_id);
    return d;
}
async function mlGet(cta, path) {      // 404/403 = "no es de esta cuenta" → null, rápido
    for (let i = 0; i < 2; i++) {
        const { access_token } = await getToken(cta);
        let r;
        try {
            r = await fetchT(`${cta.proxy}${path}${path.includes('?') ? '&' : '?'}_ts=${Date.now()}`,
                { cache: 'no-store', headers: { Authorization: `Bearer ${access_token}` } });
        } catch (e) { if (i === 0) continue; throw e; }
        if (r.ok) return r.json();
        if (r.status === 401 && i === 0) { tokens.del(cta.proxy); continue; }
        if (r.status === 429 && i === 0) { await sleep(800); continue; }
        if (r.status >= 400 && r.status < 500) return null;
        throw new Error('ML respondió ' + r.status);
    }
    return null;
}
function primerExito(ps) {
    return new Promise(res => {
        let pend = ps.length; if (!pend) return res(null);
        ps.forEach(p => Promise.resolve(p).then(r => { if (r) res(r); else if (--pend === 0) res(null); }, () => { if (--pend === 0) res(null); }));
    });
}
function candidatos(raw) {
    const s = String(raw || ''), out = [];
    const push = v => { v = String(v).replace(/\D/g, ''); if (v.length >= 8 && !out.includes(v)) out.push(v); };
    try { const j = JSON.parse(s); if (j && typeof j === 'object') ['id', 'order_id', 'shipment_id', 'pack_id'].forEach(k => j[k] && push(j[k])); } catch (e) {}
    const mel = s.match(/MEL(\d{6,})/i); if (mel) push(mel[1]);
    (s.match(/\d{8,}/g) || []).forEach(push);
    return out.sort((a, b) => b.length - a.length);
}
// Número (venta, pack o envío) → { cta, buyerId, nick, claves }
async function resolverNumero(raw) {
    const desde = (cta, o, claves) => (o && o.id && o.buyer && o.buyer.id) ? { cta, buyerId: o.buyer.id, nick: o.buyer.nickname, claves } : null;
    const t = [];
    for (const n of candidatos(raw)) for (const cta of CUENTAS) {
        t.push(mlGet(cta, `/api/orders/${n}`).then(o => desde(cta, o, [n])).catch(() => null));
        t.push(mlGet(cta, `/api/packs/${n}`).then(async pk => {
            const oid = pk && pk.orders && pk.orders[0] && pk.orders[0].id;
            return oid ? desde(cta, await mlGet(cta, `/api/orders/${oid}`), [n]) : null;
        }).catch(() => null));
        t.push(mlGet(cta, `/api/shipments/${n}`).then(async sh => {
            const oid = sh && (sh.order_id || (sh.order && sh.order.id));
            return oid ? desde(cta, await mlGet(cta, `/api/orders/${oid}`), [n, String(oid)]) : null;
        }).catch(() => null));
    }
    return primerExito(t);
}
// Texto → compradores cuyo usuario contiene lo escrito (las dos cuentas)
async function buscarNick(q) {
    const ql = q.toLowerCase(), porId = new Map();
    await Promise.all(CUENTAS.map(async cta => {
        const { user_id } = await getToken(cta);
        const r = await mlGet(cta, `/api/orders/search?seller=${user_id}&q=${encodeURIComponent(q)}&sort=date_desc&limit=50`).catch(() => null);
        ((r && r.results) || []).forEach(o => {
            const b = o.buyer; if (!b || !b.id) return;
            if (!String(b.nickname || '').toLowerCase().includes(ql)) return;      // q también matchea títulos
            const e = porId.get(b.id) || { id: b.id, nick: b.nickname, ventas: new Set(), ult: '' };
            e.ventas.add(String(o.pack_id || o.id));
            if ((o.date_created || '') > e.ult) e.ult = o.date_created;
            porId.set(b.id, e);
        });
    }));
    return [...porId.values()].map(e => ({ id: e.id, nick: e.nick, n: e.ventas.size, ult: e.ult }))
        .sort((a, b) => {
            const ea = a.nick.toLowerCase().startsWith(ql), eb = b.nick.toLowerCase().startsWith(ql);
            return ea !== eb ? (ea ? -1 : 1) : b.ult.localeCompare(a.ult);
        });
}
// Compras de un comprador en las dos cuentas (una compra = un pack o una orden suelta)
async function comprasDe(buyerId) {
    const porCuenta = await Promise.all(CUENTAS.map(async cta => {

        const enLleva = new Set(loQueSale(c).map(i => String(i.sku)));
        const sueltos = x.desc.items.filter(i => i.ok && !enLleva.has(String(i.sku)));
        if (sueltos.length) out.push(`<span class="ok-chip">➖ Descontado de Ecom ${esc(cuandoTxt(x.desc.at))}: ${sueltos.map(i => { const e = CAT && CAT.bySku[i.sku]; return `${esc(e ? [e.titulo, e.color, e.talle].filter(Boolean).join(' ') : 'SKU ' + i.sku)} −${i.q}${i.despues != null ? ' (quedó ' + esc(i.despues) + ')' : ''}`; }).join(', ')}</span>`);
    }
    return out.length ? `<div class="c-extra">${out.join('')}</div>` : '';
}
// El ✓ grande de la tarjeta: descontado de Ecom (verde) · falta (naranja) · haciéndose en la nube
function ecomChk(c) {
    if (tareaAbierta(c)) return `<span class="ecom-chk corre" title="Haciéndose en la nube">⏳</span>`;
    if (!loQueSale(c).some(i => i.sku)) return '';
    return descPendiente(c) ? `<span class="ecom-chk falta" title="Falta descontar de Ecom">➖</span>`
        : `<span class="ecom-chk" title="Descontado de Ecom">✓</span>`;
}
// ¿Queda algo con SKU sin descontar de Ecom?
function descPendiente(c) {
    const hechos = new Set(((c.extra && c.extra.desc && c.extra.desc.items) || []).filter(i => i.ok).map(i => i.sku));
    return loQueSale(c).some(i => i.sku && !hechos.has(i.sku));
}
// Renglón de la tarjeta cerrada: fotos de lo que se lleva + qué es, en corto
function resumenCorto(c) {
    const its = c.items || [];
    if (CON_NUEVO.has(c.motivo)) {
        const camb = its.filter(i => i.nuevo);
        const a = camb[0];
        let txt = c.nota || '';
        if (a) {          // lo importante primero: el cambio (la foto ya dice qué artículo es)
            const nc = a.nuevo.c || a.c, nt = a.nuevo.t || a.t, nn = a.nuevo.n || a.n;
            if (normNom(nn) !== normNom(a.n)) txt = `${a.n} ${a.c} ${a.t} → ${nn} ${nc} ${nt}`;      // otro artículo
            else {
                txt = normNom(nc) === normNom(a.c) ? `${a.c} · T: ${a.t} → ${nt}`
                    : normNom(nt) === normNom(a.t) ? `${a.c} → ${nc} · T: ${a.t}`
                    : `${a.c} ${a.t} → ${nc} ${nt}`;
                txt += ` · ${a.n}`;
            }
            txt += camb.length > 1 ? ` (+${camb.length - 1} más)` : '';
        }
        return { fotos: camb.map(i => i.nuevo.img || i.img).filter(Boolean).slice(0, 3), txt };
    }
    const sel = its.filter(i => i.sel);
    let txt;
    if (c.motivo === 'confusion') txt = `Mandarle ${sel.length ? sel.map(i => i.n).slice(0, 2).join(', ') : 'lo suyo'}` +
        (c.con && c.con.numero ? ` · se cruzó con ${c.con.numero}` : '');
    else if (c.motivo === 'otracosa') txt = `Mandarle de nuevo ${sel.length ? sel.map(i => [i.n, i.c, i.t].filter(Boolean).join(' ')).slice(0, 2).join(', ') : 'lo que compró'}` +
        (c.con && c.con.items && c.con.items.length ? ` · le llegó ${c.con.items.map(i => [i.c, i.t].filter(Boolean).join(' ')).join(', ')}` : '');
    else if (c.motivo === 'fallado') txt = `Fallado: ${sel.length ? sel.map(i => [i.n, i.c, i.t].filter(Boolean).join(' ')).slice(0, 2).join(', ') : 'ver detalle'}`;
    else txt = c.nota || sel.map(i => i.n).join(', ') || 'Ver detalle';
    return { fotos: sel.map(i => i.img).filter(Boolean).slice(0, 3), txt };
}

function pintar() {
    pintarResumen();
    const el = $('lista');
    if (TAB === 'hechos') {
        if (!HECHOS_CARGADOS && !HECHOS.length) { el.innerHTML = '<div class="cargando">Cargando hechos…</div>'; return; }
        if (!HECHOS.length) { el.innerHTML = '<div class="vacio"><big>✅</big>Todavía no hay cambios hechos.</div>'; return; }
        const porDia = new Map();
        HECHOS.forEach(c => { const d = String(c.hecho_en || '').slice(0, 10); if (!porDia.has(d)) porDia.set(d, []); porDia.get(d).push(c); });
        el.innerHTML = [...porDia].map(([d, cs]) => `<div class="grupo-t"><b>${esc(relDia(d) || DIAS[diaSem(d)] || '')}</b><span>${esc(ddmm(d))}</span><i>${cs.length}</i></div>` + cs.map(cardHTML).join('')).join('');
        return;
    }
    if (!PEND.length) {
        el.innerHTML = bannerAvisos() + `<div class="vacio"><big>🎉</big>No hay cambios pendientes.<br>Tocá <b>＋ Nuevo cambio</b> para cargar uno.</div>`;
        return;
    }
    const h = hoyAR(), grupos = new Map();
    const atr = PEND.filter(c => c.fecha < h);
    if (atr.length) grupos.set('atr', atr);
    PEND.filter(c => c.fecha >= h).forEach(c => { if (!grupos.has(c.fecha)) grupos.set(c.fecha, []); grupos.get(c.fecha).push(c); });
    el.innerHTML = bannerAvisos() + [...grupos].map(([k, cs]) => {
        const tit = k === 'atr' ? `<div class="grupo-t atr"><b>⚠️ Atrasados</b><span>quedaron sin hacer</span><i>${cs.length}</i></div>`
            : `<div class="grupo-t${k === h ? ' hoy' : ''}"><b>${esc(relDia(k) || DIAS[diaSem(k)])}</b><span>${esc(relDia(k) ? nombreDia(k) : ddmm(k))}</span><i>${cs.length}</i></div>`;
        return tit + cs.map(cardHTML).join('');
    }).join('');
}

// Acciones de las tarjetas
async function guardarEnNube(c) {
    const body = { ...c };
    const r = await api('/api/cambios', body);
    return normCambio(r.cambio);
}
function reemplazar(c) {
    PEND = PEND.filter(x => x.id !== c.id); HECHOS = HECHOS.filter(x => x.id !== c.id);
    if (c.estado === 'pendiente') PEND.push(c);
    if (c.estado === 'hecho') HECHOS.unshift(c);
    PEND.sort((a, b) => a.fecha.localeCompare(b.fecha) || String(a.creado).localeCompare(String(b.creado)));
    guardarCache(); pintar();
    cargarConteos(false);
}
async function cambiarEstado(c, estado, msg, deshacer) {
    const antes = { ...c };
    try {
        const nuevo = await guardarEnNube({ ...c, estado });
        reemplazar(nuevo);
        if (msg) toast(msg, deshacer ? 'Deshacer' : null, async () => { try { reemplazar(await guardarEnNube({ ...antes })); } catch (e) { toast('No se pudo deshacer'); } }, 6000);
    } catch (e) { toast(e.clave ? 'Falta la clave' : 'No se pudo guardar · revisá la conexión'); }
}
// Nº de venta: tocar = abrir la venta en Mercado Libre · mantener apretado = copiarlo
const linkVenta = v => `https://vendedores.mercadolibre.com.ar/ventas/${encodeURIComponent(v)}/detalle`;
let _lpVenta = null, _lpHecho = false;
$('lista').addEventListener('pointerdown', e => {
    const b = e.target.closest('[data-venta]'); if (!b) return;
    _lpHecho = false; clearTimeout(_lpVenta);
    _lpVenta = setTimeout(async () => {
        _lpHecho = true;
        const ok = await copiar(b.dataset.venta);
        b.classList.toggle('ok', ok); setTimeout(() => b.classList.remove('ok'), 1200);
        try { navigator.vibrate && navigator.vibrate(30); } catch (err) {}
        toast(ok ? `✓ Copiado: ${b.dataset.venta}` : 'No se pudo copiar', null, null, 1600);
    }, 550);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => $('lista').addEventListener(ev, () => clearTimeout(_lpVenta)));
$('lista').addEventListener('contextmenu', e => { if (e.target.closest('[data-venta]')) e.preventDefault(); });
$('lista').addEventListener('click', async e => {
    const vb = e.target.closest('[data-venta]');
    if (vb) {
        if (_lpHecho) { _lpHecho = false; return; }          // fue mantener apretado (ya copió)
        window.open(linkVenta(vb.dataset.venta), '_blank');
        return;
    }
    const cp = e.target.closest('[data-copiar]');
    if (cp) {
        const ok = await copiar(cp.dataset.copiar);          // tocar = copiar (sin cartelito "copiar")
        cp.classList.toggle('ok', ok);
        setTimeout(() => cp.classList.remove('ok'), 1200);
        toast(ok ? `✓ Copiado: ${cp.dataset.copiar}` : 'No se pudo copiar', null, null, 1600);
        return;
    }
    if (e.target.closest('[data-avisos]')) return abrirAvisos();
    if (e.target.closest('[data-avisos-x]')) { try { localStorage.setItem(PUSH_OCULTO, '1'); } catch (err) {} return pintar(); }
    const card = e.target.closest('.card');
    if (card && e.target.closest('[data-toggle]')) {         // tocar la tarjeta → se abre / se cierra
        const ab = card.classList.toggle('abierta');
        if (ab) ABIERTAS.add(card.dataset.id); else ABIERTAS.delete(card.dataset.id);
        return;
    }
    const b = e.target.closest('[data-acc]');
    if (!b || !card) return;
    const id = card.dataset.id, c = PEND.find(x => x.id === id) || HECHOS.find(x => x.id === id);
    if (!c) return;
    const acc = b.dataset.acc;
    if (acc === 'hecho') return cambiarEstado(c, 'hecho', `✅ Cambio de ${c.nick || c.comprador} hecho`, true);
    if (acc === 'volver') return cambiarEstado(c, 'pendiente', 'Volvió a pendientes');
    if (acc === 'borrar') { if (confirm(`¿Borrar el cambio de ${c.nick || c.comprador}?`)) cambiarEstado(c, 'borrado', '🗑 Borrado', true); return; }
    if (acc === 'editar') return abrirForm(c);
    if (acc === 'mensajes') return abrirMensajes(c);
    if (acc === 'ecom') return descontarEcom(c, b);
    if (acc === 'marcar') return marcarDescontado(c);
    if (acc === 'wa') return compartirWA(c);
    if (acc === 'etiqueta') return abrirEtiqueta(c);
    if (acc === 'mover') {
        const ya = card.querySelector('.mover');
        if (ya) { ya.remove(); return; }
        const div = document.createElement('div');
        div.className = 'mover dias';
        div.innerHTML = habiles(6).map(d => `<button class="dia${d === c.fecha ? ' on' : ''}" data-mover="${d}"><small>${esc(relDia(d) || DIAS[diaSem(d)].slice(0, 3))}</small><b>${esc(ddmm(d))}</b></button>`).join('');
        div.onclick = async ev => {
            const d = ev.target.closest('[data-mover]'); if (!d) return;
            ev.stopPropagation();
            if (d.dataset.mover === c.fecha) { div.remove(); return; }
            try { reemplazar(await guardarEnNube({ ...c, fecha: d.dataset.mover })); toast(`📅 Pasado al ${nombreDia(d.dataset.mover)}`); }
            catch (err) { toast('No se pudo guardar'); }
        };
        card.querySelector('.c-acc').after(div);
    }
});

const proxHabilDefault = () => proxHabil(hoyAR());       // si cargo hoy, va para el próximo día hábil

function pasoArticulosListo() {
    if (!F || !F.motivo) return false;

    if (MANDAR_SUYO.has(F.motivo)) return (F.items || []).some(i => i.sel) || !(F.items || []).length;
    return true;

// ── Búsqueda dentro del formulario ──
function resultadosHTML() {
    if (BUSQ.estado === 'buscando') return `<div class="cargando">Buscando…</div>`;
    if (BUSQ.estado === 'compras') return `<div class="cargando">Cargando las compras de <b>${esc(BUSQ.comprador && BUSQ.comprador.nick)}</b>…</div>`;
    if (BUSQ.error) return `<div class="error">😕 ${esc(BUSQ.error)}</div>`;
    if (BUSQ.compras) {
        const b = BUSQ.comprador;
        return `<div class="sug-t">Compras de <b style="color:var(--text)">${esc(b.nick)}</b> · tocá la que tiene el problema</div>` +
            BUSQ.compras.slice(0, 25).map((v, k) => {
                const est = estadoEnvio(v.ship, v.orders[0]);
                const its = articulosDe(v.orders);
                const match = b.claves && [v.key, ...v.orders.map(o => String(o.id)), v.ship ? String(v.ship.id) : ''].some(x => b.claves.includes(x));
                return `<button class="compra${match ? ' sel' : ''}" data-compra="${k}"><div class="compra-top"><span class="cta ${v.cta.nombre}">${v.cta.nombre.toUpperCase()}</span>` +

                    `<div class="its">${its.slice(0, 4).map(i => itemHTML(i)).join('')}${its.length > 4 ? `<div class="ayuda">+${its.length - 4} artículos más</div>` : ''}</div></button>`;
            }).join('');
    }
    if (BUSQ.sug.length) {

            BUSQ.sug.slice(0, 10).map((c, k) => `<button data-sug="${k}"><b>👤 ${esc(c.nick)}</b><span>${c.n} compra${c.n !== 1 ? 's' : ''} · ${esc(fechaML(c.ult))}</span></button>`).join('') + `</div>`;

}
function pintarRes() {

}
function limpiarPegado(t) {
    t = String(t || '').trim();
    if (/^\{/.test(t)) return t;
    t = (t.split(/\r?\n/).map(s => s.trim()).find(Boolean) || '').replace(/\s+/g, ' ');
    const par = t.match(/\(([^()]{3,})\)\s*$/); if (par) return par[1].trim();
    const num = t.match(/(?:^|[\s#:])((?:MEL)?\d[\d ]{8,22}\d)\b/i);
    if (num && !/^[\d\s.\-#]+$/.test(t)) return num[1].replace(/\s+/g, '');
    return t.replace(/^@/, '').slice(0, 80);
}
const esNumero = t => /^\{/.test(t) || /^(MEL)?[\d\s.\-#]+$/i.test(t);
async function buscar(txt, desdeSugerencia) {
    txt = String(txt || '').trim();
    if (!txt) return;
    const seq = ++BUSQ.seq;
    BUSQ.error = ''; BUSQ.compras = null;
    try {
        if (esNumero(txt)) {
            BUSQ.estado = 'buscando'; BUSQ.sug = []; pintarRes();
            const hit = await resolverNumero(txt);
            if (seq !== BUSQ.seq) return;
            if (!hit) { BUSQ.estado = ''; BUSQ.error = 'No encontré esa venta o envío en Mikra ni Chaya.'; return pintarRes(); }
            return elegirComprador({ id: hit.buyerId, nick: hit.nick, claves: hit.claves }, seq);
        }
        if (!desdeSugerencia) { BUSQ.estado = 'buscando'; pintarRes(); }
        const q = txt.replace(/^@/, '');
        const lista = await buscarNick(q);
        if (seq !== BUSQ.seq) return;
        BUSQ.estado = '';
        if (!lista.length) { BUSQ.sug = []; BUSQ.error = desdeSugerencia ? '' : `No hay compras de "${q}" en Mikra ni Chaya.`; return pintarRes(); }
        const exacto = lista.find(c => c.nick.toLowerCase() === q.toLowerCase());
        if (!desdeSugerencia && (exacto || lista.length === 1)) return elegirComprador(exacto || lista[0], seq);
        BUSQ.sug = lista; pintarRes();
    } catch (e) {
        if (seq !== BUSQ.seq) return;
        BUSQ.estado = ''; BUSQ.error = 'Error al buscar: ' + (e.message || e); pintarRes();
    }
}
async function elegirComprador(c, seq) {
    seq = seq || ++BUSQ.seq;
    BUSQ.comprador = c; BUSQ.sug = []; BUSQ.estado = 'compras'; BUSQ.error = ''; pintarRes();
    const inp = $('fBusq'); if (inp) { inp.value = c.nick; inp.blur(); }
    const compras = await comprasDe(c.id);
    if (seq !== BUSQ.seq) return;
    BUSQ.estado = '';
    if (!compras.length) { BUSQ.error = `No encontré compras de ${c.nick}.`; return pintarRes(); }
    BUSQ.compras = compras;
    // Si buscó por número de venta/envío, esa compra queda elegida directo
    const k = c.claves ? compras.findIndex(v => [v.key, ...v.orders.map(o => String(o.id)), v.ship ? String(v.ship.id) : ''].some(x => c.claves.includes(x))) : -1;
    if (k >= 0) return elegirCompra(k);
    pintarRes();
}
function elegirCompra(k) {
    const v = BUSQ.compras[k];
    const ra = (v.ship && v.ship.receiver_address) || {};
    F.cuenta = v.cta.nombre;
    F.nick = (v.orders[0].buyer && v.orders[0].buyer.nickname) || (BUSQ.comprador && BUSQ.comprador.nick) || '';
    F.buyer_id = String((v.orders[0].buyer && v.orders[0].buyer.id) || (BUSQ.comprador && BUSQ.comprador.id) || '');
    F.comprador = ra.receiver_name || '';
    F.venta = v.key;
    F.envio = v.ship ? String(v.ship.id) : '';
    F.items = articulosDe(v.orders).map(i => ({ ...i, qt: i.q, ...(i.qv ? { qvt: i.qv } : {}), sel: false, nuevo: null }));
    F.con = null;
    if (F.items.length === 1) F.items[0].sel = true;
    pintarForm();
    const kMsg = claveMsg(F);
    contarMensajes(F.cuenta, F.venta).then(n => { MSG_N.set(kMsg, n); if (F && claveMsg(F) === kMsg && (n || MSG_ACT.get(kMsg))) pintarForm(); }).catch(() => {});
    $('hoja').querySelector('.hoja-bd').scrollTo({ top: 0, behavior: 'smooth' });
}

$('form').addEventListener('click', async e => {

        try { txt = await navigator.clipboard.readText(); } catch (err) {
            const a = $('fAyuda'); if (a) { a.textContent = 'No me dejó leer lo copiado: mantené apretado el cuadro y tocá "Pegar".'; a.classList.add('aviso'); }

    }
    if (t.closest('#fOtra')) { F.venta = ''; F.items = []; F.motivo = ''; F.con = null; BUSQ = { seq: BUSQ.seq + 1, sug: [], compras: null, comprador: null, estado: '', error: '' }; pintarForm(); return; }
    const sg = t.closest('[data-sug]'); if (sg) return elegirComprador(BUSQ.sug[+sg.dataset.sug]);
    const cp = t.closest('[data-compra]'); if (cp) return elegirCompra(+cp.dataset.compra);
    const mo = t.closest('[data-motivo]');
    if (mo) {
        if (F.motivo !== mo.dataset.motivo) F.con = null;     // "con" es de confusión (con quién) u otra cosa (qué le llegó)
        F.motivo = mo.dataset.motivo;
        // por defecto: mandarle todo lo suyo (si se confundió o le mandamos otra cosa)
        if ((F.motivo === 'confusion' || F.motivo === 'otracosa') && !(F.items || []).some(i => i.sel)) (F.items || []).forEach(i => i.sel = true);
        return pintarForm();

    const qb = t.closest('[data-qm], [data-qp]');           // cuántas cambia (de las que compró)
    if (qb && !qb.disabled) {
        const menos = qb.dataset.qm != null, it = F.items[+(menos ? qb.dataset.qm : qb.dataset.qp)];
        const tot = Math.max(+it.qt || 0, +it.q || 1);
        if (!it.qt) it.qt = tot;
        it.q = Math.min(tot, Math.max(1, (+it.q || 1) + (menos ? -1 : 1)));
        if (it.qvt) it.qv = Math.max(1, Math.round(it.qvt * it.q / tot));   // "Pack X2" fuera de la tabla: unidades vendidas
        return pintarForm();
    }
    const el = t.closest('[data-elegir]'); if (el) return abrirPicker(+el.dataset.elegir);
    const qu = t.closest('[data-quitar]'); if (qu) { F.items[+qu.dataset.quitar].nuevo = null; return pintarForm(); }
    const tr = t.closest('[data-traer]'); if (tr) { F.traer = tr.dataset.traer === '1'; return pintarForm(); }
    const fe = t.closest('[data-fecha]'); if (fe) { F.fecha = fe.dataset.fecha; return pintarForm(); }
    if (t.closest('#fCon')) return abrirConQuien();
    if (t.closest('#fRec')) return abrirPickerRec();
    const rq = t.closest('[data-recq]'); if (rq) { F.con.items.splice(+rq.dataset.recq, 1); if (!F.con.items.length) F.con = null; return pintarForm(); }

});

// Buscar un artículo del catálogo por nombre (todas las palabras), con foto y stock total
function artsQueCoinciden(q) {
    if (!CAT) return [];
    const pal = normNom(q).normalize('NFD').replace(/[̀-ͯ]/g, '').split(' ').filter(Boolean);
    const out = [];
    for (const [tit, vars] of CAT.porTitulo) {
        const tn = normNom(tit).normalize('NFD').replace(/[̀-ͯ]/g, '');
        if (pal.length && !pal.every(p => tn.includes(p))) continue;
        if (vars.some(v => CAT.packs[v.sku])) continue;                 // packs/conjuntos (tabla de packs): no se eligen sueltos
        const stock = vars.reduce((a, v) => a + Math.max(0, Number(v.stock) || 0), 0);
        const conFoto = vars.find(v => CAT.imgs[v.sku]);
        out.push({ tit, n: vars.length, stock, img: conFoto ? fotoSku(conFoto.sku) : '' });
    }
    return out.sort((a, b) => (b.stock > 0) - (a.stock > 0) || a.tit.localeCompare(b.tit, 'es')).slice(0, 40);
}

function textoBotonEtq() {

// Cartel con el resultado de cada paso: se va llenando en vivo y queda abierto hasta tocar OK
function cartelPasos(titulo) {
    const o = document.createElement('div');
    o.className = 'sub open'; o.style.cssText = 'z-index:350;align-items:center;padding:16px';
    o.innerHTML = `<div class="sub-in cartel"><div class="cartel-tit">${esc(titulo)}</div><div class="cartel-lista"></div>` +
        `<div class="cartel-pie"></div><button class="guardar cartel-ok" disabled>Mandando…</button></div>`;
    document.body.appendChild(o);
    const filas = {};
    return {
        paso(k, ico, txt, det) {
            let r = filas[k];
            if (!r) { r = filas[k] = document.createElement('div'); o.querySelector('.cartel-lista').appendChild(r); }
            r.className = 'cartel-fila ' + (ico === '✅' ? 'ok' : /[⏳🖨]/u.test(ico) ? 'esp' : 'mal');
            r.innerHTML = `<span class="cartel-ico">${ico}</span><div><b>${esc(txt)}</b>${det ? `<small>${det}</small>` : ''}</div>`;
        },
        quitar(k) { if (filas[k]) { filas[k].remove(); delete filas[k]; } },
        pie(h) { o.querySelector('.cartel-pie').innerHTML = h || ''; },
        boton(txt, alCerrar) {
            const b = o.querySelector('.cartel-ok'); b.disabled = false; b.textContent = txt;
            b.onclick = () => { o.remove(); alCerrar && alCerrar(); };
        }
    };
}
// Resultado de Ecom en el cartel: un renglón por artículo (qué es, talle, −n y cuánto quedó)
function pasosEcom(R, c, res) {

    const ct = i => esc([i.c, i.t ? 'T: ' + i.t : ''].filter(Boolean).join(' · '));
    if (res.nada) R.paso('ecom', '✅', 'Ecom: ya estaba descontado');

        `${ct(a)}<br>Ecom −${+i.q || 1} · quedó <b>${esc(i.despues)}</b> <span class="cartel-sku">(antes ${esc(i.antes)} · SKU ${esc(i.sku)})</span>`); });

    sale.filter(i => !i.sku).forEach((a, k) => R.paso('ecom-sin' + k, '⚠️', a.n, `${ct(a)}<br>No tiene SKU: descontalo a mano en Ecom`));
}
// El avance de la tarea de la nube (extra.tarea) → renglones del cartel
function pintarTarea(R, c, info) {
    const x = c.extra || {}, t = x.tarea; if (!t) return;
    const P = t.pasos || {}, hh = v => v ? String(v).slice(11, 16) : '';
    const NOM = { grande: 'Etiqueta grande', oficina: 'Ticket de la oficina' };
    const DONDE = { grande: 'la etiquetera de la oficina', oficina: 'la ticketera de la oficina' };
    if (P.caso) {
        const st = P.caso;
        if (st.estado === 'pendiente') R.paso('caso', '⏳', 'Creando el caso en Flex…');
        else if (st.estado === 'ok') R.paso('caso', '✅', `Caso ${st.id} ${st.dup ? 'ya estaba abierto en Flex' : 'creado en Flex'}`, esc(info.casoDet || ''));
        else R.paso('caso', '❌', 'No se pudo crear el caso en Flex', esc(st.error || '') + '<br>No se imprimió ni se descontó nada.');
    } else if (info.conCaso && x.caso) R.paso('caso', '✅', `Caso ${x.caso.id}`, 'Ya estaba creado en Flex');
    for (const k of ['grande', 'oficina']) {
        const st = P[k]; if (!st) continue;
        const E = {
            pendiente: ['⏳', `${NOM[k]}: mandando…`, ''],
            enviada: ['🖨️', `${NOM[k]}: imprimiendo…`, ''],
            pc: ['⚠️', `${NOM[k]}: la PC está desconectada`, 'Quedó en cola: sale sola cuando se conecte la PC (y ahí se termina el cambio).'],
            impresa: ['✅', `${NOM[k]}: impresa`, `Salió en ${DONDE[k]} · ${hh(st.at)}`],
            offline: ['❌', `${NOM[k]}: ${k === 'grande' ? 'la etiquetera' : 'la ticketera'} no contesta`, 'Revisá que esté prendida y con papel.'],
            error: ['❌', `${NOM[k]}: error al imprimir`, esc(st.error || '')],
            sinrespuesta: ['⚠️', `${NOM[k]}: la impresora nunca contestó`, ''],
            nohecho: ['➖', `${NOM[k]}: no se hizo`, ''],
        }[st.estado] || ['⚠️', NOM[k], esc(st.estado)];
        R.paso(k, E[0], E[1], E[2]);
    }
    if (P.ecom) {
        const st = P.ecom;
        if (st.estado === 'pendiente' || st.estado === 'enviando') R.paso('ecom', '⏳', 'Descontando de Ecom…');
        else if (st.res) pasosEcom(R, c, st.res);
        else if (st.estado === 'clave') R.paso('ecom', '❌', 'Clave del stock incorrecta', 'No se descontó nada. Tocá ➖ Ecom y poné la clave de nuevo.');
        else if (st.estado === 'sinclave') R.paso('ecom', '⚠️', 'Ecom: no se descontó', 'Faltó la clave del stock. Tocá ➖ Ecom.');
        else if (st.estado === 'revisar') R.paso('ecom', '⚠️', 'Ecom: no se sabe si se descontó', 'Se cortó mientras se mandaba: fijate en Movimientos de Ecom antes de reintentar.');
        else if (st.estado === 'nohecho') R.paso('ecom', '➖', 'Ecom: no se descontó', 'Primero tiene que estar el caso.');
        else R.paso('ecom', '❌', 'Ecom: no se pudo descontar', esc(st.error || st.estado));
    }
    if (t.fin && P.hecho) R.paso('hecho', P.hecho.estado === 'ok' ? '✅' : '⚠️', P.hecho.estado === 'ok' ? 'Pasó a Hechos' : 'No se marcó hecho',
        P.hecho.estado === 'ok' ? '' : 'Algo no salió: cuando esté resuelto tocá ✅ Hecho en la tarjeta.');
}
function tareaAbierta(c) { const t = (c.extra || {}).tarea; return !!(t && !t.fin); }
// Le pide a la NUBE que haga los pasos (caso, imprimir, Ecom, hecho): sigue aunque se cierre la app
async function pedirProceso(c, pasos, titulo, info) {
    let hdrs = {};
    if (pasos.ecom && pasos.ecom.length) {
        const k = claveStock() || await pedirClaveStock(false);
        if (k) hdrs = { 'X-Clave-Stock': k };
        else {
            delete pasos.ecom; delete pasos.motivo; delete pasos.hecho;
            toast('Sin la clave del stock no se descuenta de Ecom');
            if (!Object.keys(pasos).length) return;
        }
    }
    const R = cartelPasos(titulo);
    R.paso('nube', '⏳', 'Mandando a la nube…');
    let d;
    try { d = await api('/api/cambios/procesar', { id: c.id, pasos }, hdrs); }
    catch (e) {
        R.paso('nube', '❌', 'No se pudo mandar a la nube', esc(e.clave ? 'Falta la clave de la nube' : (e.message || String(e))) + '<br>No se hizo nada.');
        R.boton('OK'); return;
    }
    if (!d.cambio) { R.paso('nube', '❌', 'La nube no lo aceptó', esc(d.error || '')); R.boton('OK'); return; }
    R.quitar('nube');
    if (!d.ok) toast('Ya se estaba haciendo: te muestro cómo va');
    return seguirTarea(normCambio(d.cambio), R, info);
}
// Muestra el avance hasta que termina. Si cerrás el cartel (o la app), la nube sigue igual.
async function seguirTarea(c, R, info) {
    let abierto = true;
    const cerrar = () => { abierto = false; reemplazar(c); info.alCerrar && info.alCerrar(c); };
    R.boton('Cerrar · se termina solo en la nube', cerrar);
    R.pie('Ya está en la nube: aunque cierres la app, se termina solo.');
    pintarTarea(R, c, info);
    const hasta = Date.now() + 6 * 60e3;
    while (Date.now() < hasta) {
        await sleep(abierto ? 1300 : 5000);
        let d; try { d = await api('/api/cambios/uno?id=' + encodeURIComponent(c.id)); } catch (e) { continue; }
        if (!d || !d.cambio) continue;
        c = normCambio(d.cambio);
        if (!abierto) { if (!tareaAbierta(c)) { reemplazar(c); return c; } continue; }
        pintarTarea(R, c, info);
        if (!tareaAbierta(c)) {
            const P = (c.extra.tarea || {}).pasos || {};
            if (P.ecom && P.ecom.estado === 'clave') guardarClaveStock('');
            const ok = ['grande', 'oficina'].every(k => !P[k] || P[k].estado === 'impresa') &&
                (!P.ecom || P.ecom.estado === 'ok') && (!P.caso || P.caso.estado === 'ok');
            R.pie(ok ? '' : 'Lo que salió bien ya quedó guardado; si reintentás, no se repite.');
            R.boton('OK', cerrar);
            reemplazar(c);
            return c;
        }
    }
    return c;
}

async function etqAccion(imprimir, btn) {
    const { c, f } = ETQ;
    const valor = Math.round(Number(String(f.valor || '').replace(/\./g, '').split(',')[0].replace(/\D/g, '')) || 0);
    const x = c.extra || {};
    if (!x.caso) {
        if (!f.zona.trim()) return toast('📍 Falta la zona');
        if (!valor) return toast('💵 Falta el valor (lo pide el caso de Flex)');
    }
    if (tareaAbierta(c)) toast('Ya se está haciendo en la nube');
    const caso = (x.caso && x.caso.id) || '%%CASO%%';          // la nube pone el número cuando crea el caso
    const pasos = {};
    if (!x.caso) {
        const notas = [f.lleva ? 'Llevar: ' + f.lleva.replace(/\n/g, ', ') : '', c.traer && f.retira ? 'Retirar: ' + f.retira.replace(/\n/g, ', ') : '', f.nota]
            .filter(Boolean).join(' · ').slice(0, 450);
        pasos.caso = { shippingId: ETQ.sid || ('MAN-' + Date.now()), orderId: c.venta || '', comprador: c.nick || f.nombre,
            zona: f.zona.trim(), cuenta: c.cuenta || '', tipo: 'cambio', valor: String(valor), fechaEstimada: dmyIso(f.fecha),
            notas, direccion: [f.calle, f.ref, f.zona].filter(Boolean).join(' · '), chofer: '' };
    }
    if (imprimir) {
        if (ETQ.imp.grande) pasos.grande = { html: etiquetaHTML(f, caso, c), title: `Cambio ${c.nick || f.nombre} ${caso} (etiqueta)` };
        if (ETQ.imp.oficina) pasos.oficina = { html: ticketHTML(f, caso, c), title: `Cambio ${c.nick || f.nombre} ${caso} (ticket)` };
        const pe = ETQ.imp.ecom ? pendientesEcom(c) : [];
        if (pe.length) { pasos.ecom = pe.map(i => ({ sku: i.sku, q: i.q })); pasos.motivo = motivoEcom(c); }
        if (ETQ.imp.hecho && c.estado !== 'hecho') pasos.hecho = true;
    }
    if (!Object.keys(pasos).length) return toast('Nada para hacer');
    btn.disabled = true;
    await pedirProceso(c, pasos, `↻ Cambio · ${c.nick || f.nombre || ''}`, {
        conCaso: true,
        casoDet: `Cambio · vence el ${dmyIso(f.fecha)} · $ ${valor.toLocaleString('es-AR')}`,
        alCerrar: cf => {                                    // al tocar OK / Cerrar
            if (!ETQ || ETQ.c.id !== cf.id) return;
            if (cf.estado === 'hecho' || tareaAbierta(cf)) return cerrarSub();
            const P = ((cf.extra || {}).tarea || {}).pasos || {};
            ['grande', 'oficina'].forEach(k => { if (P[k] && P[k].estado === 'impresa') ETQ.imp[k] = false; });   // si reintenta, no se repite
            ETQ.c = cf; ETQ.imp.ecom = descPendiente(cf); pintarEtiqueta();
        }
    });
    if (btn.isConnected) btn.disabled = false;
}

const MSG_ACT = new Map();      // cuenta|venta → true si ML deja escribir (conversación activa)

// ── Mandar mensajes: por la bandeja de Ecomm (los tokens de ML de las apps son solo
// lectura), con la MISMA clave que cambiar stock (localStorage mikra_clave_stock, la que
// ya usan Pedidos y Control de Stock en este mismo sitio). Sin clave no se manda nada.
const ECOMM_PROXY = 'https://ecomm-token-proxy.rafaelassir.workers.dev';
const CLAVE_STOCK_LS = 'mikra_clave_stock';
const claveStock = () => { try { return localStorage.getItem(CLAVE_STOCK_LS) || ''; } catch (e) { return ''; } };
const guardarClaveStock = v => { try { v ? localStorage.setItem(CLAVE_STOCK_LS, v) : localStorage.removeItem(CLAVE_STOCK_LS); } catch (e) {} };
function pedirClaveStock(mal) {
    return new Promise(res => {
        const o = document.createElement('div');
        o.className = 'sub open'; o.style.cssText = 'z-index:400;align-items:center;padding:16px';
        o.innerHTML = `<form class="sub-in" style="border-radius:18px;max-width:360px;margin:0 auto;border:1px solid var(--border-bright)">` +
            `<div class="sub-hd"><b>🔒 Clave del stock</b></div>` +
            `<div class="ayuda" style="margin:0 0 10px">${mal ? '❌ Clave incorrecta, probá de nuevo.' : 'Es la misma clave que usás para cambiar stock (Pedidos / Control de Stock). Se pide una sola vez.'}</div>` +
            `<div class="busq"><input type="password" autocomplete="current-password" placeholder="Clave"><button class="ir">OK</button></div>` +
            `<button type="button" class="link-btn" data-x style="margin-top:8px">Cancelar</button></form>`;
        const inp = o.querySelector('input'), fin = v => { o.remove(); res(v); };
        o.querySelector('[data-x]').onclick = () => fin('');
        o.querySelector('form').onsubmit = e => { e.preventDefault(); const v = inp.value.trim(); if (!v) return; guardarClaveStock(v); fin(v); };
        document.body.appendChild(o); setTimeout(() => inp.focus(), 60);

}
async function fetchConClave(url, opts = {}) {
    for (let i = 0; i < 4; i++) {
